<script>const LOG=[{v:104,d:"2026-11-27",t:"13:57",s:"模試で年度・回を選んで次の画面へ移るとき、画面が止まったように見える問題への対策。パソコン上の再現テスト（CPUを6〜10倍遅くしても、年度の切り替え20〜40ms、回の選択20〜50ms）では遅くならず、原因を特定できていないため、ホーム画面に追加したアプリで起きている可能性を考えて、端末ごとに差が出やすい処理を後回しにした。①画面を切り替えるたびに行っていた「ブラウザーの履歴の更新」と「記録の保存」を、新しい画面を描いたあとに行うように変更（アプリを閉じる・別のアプリへ移るときは、直ちに保存する）。②保存は、前回と中身が同じ項目は書き込まないようにした（模試の年度や回を選ぶたびに3〜4項目を書き直していた）。③画面を描くたびに行っていた、色の再計算をやめた（デザインを変えたときだけ行う）。戻るボタンの動き（検索・模試・勉強の各画面、起動し直したあとの戻る）は旧版と同じことを確認した。この対策で止まる症状が直るかは、まだ実機で確かめられていない。直らない場合は、ホーム画面のアプリとブラウザーのどちらで起きるか、どの画面からどの操作のときに何秒ほど止まるかを教えてほしい。"},{v:103,d:"2026-11-26",t:"13:40",s:"タグの一覧の並びを変更し、前の版で置いた4つの分野ボタンをやめた。タグの選択欄をタップして出る一覧の、いちばん上（「すべて」の次）に「分野」として エンジン（810）／シャシ（810）／整備機器等（270）／法規（270）を置き、その下に分野ごとの細かいタグ（エンジンの細かいタグ、シャシの細かいタグ…）、最後に問題タイプ（図のある問題・計算問題）を並べた。検索の欄には何も増やしていない。これまでの「エンジン（すべて）」などの項目は「分野」に1つにまとめた。検索画面のタグと、勉強の「条件を指定して出題」の細かいタグの両方が同じ並びになる。並びは、実施年（1行目）、タグと問題番号（2行目、半分ずつ）、実施月（3行目）のまま。条件欄の高さは前々回（v101）と同じ563px。問題文・選択肢・正解・解説は変えていない。確認：一覧の全69項目がすべて1件以上に当たり、分野4つとブレーキ・図のある問題の件数が全問からの手計算と一致、全2,160問で横はみ出し0、図440枚すべて読み込み成功、エラー0。"},{v:102,d:"2026-11-26",t:"13:37",s:"検索の詳細条件の並びを変更し、タグの分野をすぐ選べるようにした。①1行目を実施年（横いっぱい）に、タグと入れ替えた。②タグの欄の上に「エンジン／シャシ／整備機器等／法規」の4つのボタンを置いた。押すとその分野だけに絞り込み、もう一度押すと解除される。③その下の行は、細かいタグ（選択式）と問題番号を半分ずつの幅にした（問題番号は以前より広い）。細かいタグに分野を選ぶとボタンも同じ分野になり、細かいタグを選ぶとボタンの選択は外れる。タグのリセットは1つで、4つのボタンと細かいタグの両方を戻す。④実施月は最後の行のまま。条件欄の高さは約80px増えた。問題文・選択肢・正解・解説は変えていない。確認：4つのボタンの件数が全問からの手計算と一致（エンジン810件、シャシ810件、整備機器等270件、法規270件）、再タップで解除、細かいタグ「ブレーキ」＝77件、リセットと「詳細をリセット」が正常、全2,160問で横はみ出し0、図440枚すべて読み込み成功、エラー0。"},{v:101,d:"2026-11-26",t:"13:29",s:"検索・勉強の条件欄で、入力した欄とまだの欄を見分けやすくした。入力済みの欄は、枠と地を青緑色にし、文字を濃く太くした（キーワード・除外・問題番号・タグ・実施年・実施月・勉強の細かいタグと年の範囲）。実施月は、3月か10月を選ぶとそのボタンが青緑色になる。未入力の欄は、「例：17」などの見本の文字を小さく薄くし、選択式の「すべて」も薄い灰色にした。枠の大きさ・位置・太さは変えていない（空の状態・入力した状態の両方で、全要素の位置と大きさが前の版と完全に一致することを確認）。問題文・選択肢・正解・解説は変えていない。確認：全2,160問で横はみ出し0、図440枚すべて読み込み成功、エラー0、検索・除外・詳細条件の件数は前回と同じ。"},{v:100,d:"2026-11-26",t:"13:15",s:"勉強画面の「続き」を小さなボタンに変え、条件指定に検索・除外・細かいタグを追加した。①続きから：勉強画面の上に大きく並んでいた「続きから：…」「模試の続き」のカードをやめ、「続きから ○件」の小さなボタン1つにした。押すと「続きを選ぶ」の専用ページが開き、途中の練習（新しい順）と途中の模試を選んで再開できる。×で削除でき、記録は消えない。ブラウザの戻る・アプリ内の「戻る」で勉強画面へ戻る。続きの保存の数と中身は変えていない（練習は30件まで。保存データは増やしていない）。②勉強の「条件を指定して出題」に追加：「キーワード」（検索する言葉と、除外する言葉。ひらがなでも漢字の語に当たる。空白で複数指定）、「細かいタグ」（検索画面と同じ選択式。図のある問題・計算問題も選べる）。それぞれにリセットがある。出題の対象の件数は、入力するたびに変わる。「すぐに始める」（おまかせ・未回答・間違えた・お気に入り）は、この条件を使わない。続きの名前には、条件のキーワードも入る。分野の見出しは「タグ（分野・複数選択可。選ばなければすべて）」にした。問題文・選択肢・正解・解説は変えていない。確認：検索「ブレーキ」＝215件、除外「ドラム」＝187件、除外「どらむ」（ひらがな）＝187件、細かいタグ「ブレーキ」＝77件で全問からの手計算と一致、条件で始めた10問はすべて「ブレーキ」を含む、続きのボタン・専用ページ・削除・再開・戻る操作が正常、全2,160問で横はみ出し0、図440枚すべて読み込み成功、エラー0。"},{v:99,d:"2026-11-26",t:"13:03",s:"検索の詳細条件の並びを変更し、リセットボタンの押せる範囲を広げた。①実施月は「すべて／3月／10月」のタップ式（以前の方式）に戻し、実施月のリセットは置かない。②並び：1行目 タグ、2行目 実施年と問題番号（実施月と入れ替え）、3行目 実施月のボタン。問題番号の見出しは「問題番号」にした（欄の例示は「例：17」のまま）。③「詳細をリセット」は「問題文だけを検索」の右へ移した。④タグ・実施年・問題番号のリセットは、文字を少し大きくし、押せる範囲を左24px・上16px・右6px・下3px広げた（見た目の位置は変えていない。確認：文字の左20px、上14px、右4px、下2pxのどこを押しても反応）。条件欄の高さは545pxから563pxになった。問題文・選択肢・正解・解説は変えていない。確認：実施月3月＝1,040件、10月＝1,120件、2023年10月No.17＝2件が全問からの手計算と一致、各リセットと「詳細をリセット」が正常（実施月も「すべて」に戻る）、除外検索も前回どおり、全2,160問で横はみ出し0、図440枚すべて読み込み成功、エラー0。"},{v:98,d:"2026-11-26",t:"12:56",s:"検索の詳細条件に、項目ごとのリセットを追加。タグ・実施年・実施月・問題番号の見出しの右端に、それぞれ「リセット」を置いた。押すとその項目だけが「すべて」（問題番号は空）に戻り、指定がないときは薄い色で押せない。欄の大きさと並びは変えていない（条件欄の高さは前の版と同じ545px）。「詳細をリセット」は、4項目をまとめて戻す用に残した。問題文・選択肢・正解・解説は変えていない。確認：4つのリセットがそれぞれ、その項目だけを戻して件数が正しく変わる（問題番号を入れた直後も有効になる）、全2,160問で横はみ出し0、図440枚すべて読み込み成功、エラー0。"},{v:97,d:"2026-11-26",t:"12:50",s:"検索画面に「除外」欄を追加し、詳細条件の欄を短くした。①除外：キーワード欄の下の空いていた場所に「除外」の入力欄を置いた。ここに入れた言葉を含む問題（問題文と選択肢）は、検索結果から外れる。空白で区切ると複数指定でき、どれか1つでも含む問題が外れる。「問題文だけを検索」にも従い、ひらがなで入れても漢字の語を除外できる（例：「どらむ」で「ドラム」を含む問題を除く）。除外した語は保存され、「全てをクリア」で消える。右のボタンは「リセット」に変え、キーワードと除外をまとめて消す。「この○問を順に解く」の題名にも除外の語が入る。②詳細条件の整理：条件欄の縦の長さを約3割短くした。「資格区分（複数選択）」の見出しを省き、資格のボタンを詰めた。タグは1行、実施年と実施月は横に並べ、問題番号は「詳細をリセット」ボタンと同じ行にした。以前はタグ・No.・実施年・実施月に1つずつあった4つのリセットボタンを、「詳細をリセット」1つにまとめた。実施月は3つのボタンから選択式に変えた（すべて・3月・10月）。見出しは「タグ・実施年月・番号」に変えた。履歴を開いたときは、キーワード欄と除外欄の下に出る。問題文・選択肢・正解・解説は変えていない。確認：除外の件数が手計算の件数と一致（ブレーキ215件→「ドラム」除外187件、残りにドラムを含む問題は0件）、ひらがな・複数語・保存・リセットが正常、実施月・実施年・No.・タグの絞り込み件数が全問から数えた件数と一致、全2,160問で横はみ出し0、図440枚すべて読み込み成功、エラー0、戻る操作の確認も前回どおり。"},{v:96,d:"2026-11-25",t:"16:06",s:"戻る操作の不具合を修正。問題や模試の詳細などを開いたままアプリを閉じ、開き直してから「戻る」を押すと、前の画面（検索など）へ戻らずアプリが終了していた。原因は、開き直した直後の履歴が1件しかなく、戻る先がなかったこと。開き直して詳細・練習中の問題・結果・模試の詳細から再開したときは、1つ前の画面（検索結果の詳細なら検索、模試の詳細なら模試、練習なら開いていたタブ）を履歴の下に入れ、戻るで必ずそこへ戻るようにした。画面の更新や、ブラウザの戻る・進むで開いたときは、履歴がすでにあるため足さない。あわせて、戻ったときに一番上へ移動してしまう点を改善。勉強・検索・模試・記録・模試の詳細・更新履歴は、画面ごとのスクロール位置を覚え、ブラウザの戻る・進むとアプリ内の「戻る」のどちらでも元の位置に戻る。検索結果は「もっと見る」で広げた件数も覚えるため、開き直したあとでも同じ長さ・同じ位置で開く。位置を戻したときは、下のメニューが隠れたままにならないようにした。ブラウザ任せのスクロール位置の復元は止めて、アプリ側で行う。問題・選択肢・正解・解説は変えていない。確認：検索結果の途中から詳細を開き、ブラウザの戻る・アプリ内の戻るの両方で同じ位置に戻る。開き直し後の戻るが、詳細→検索、模試の詳細→模試、練習中→検索に戻る。更新しても履歴が増えない。戻るボタンの連打と、アプリ内の戻るの直後のブラウザの戻るも正常。全2,160問で横はみ出し0、図440枚すべて読み込み成功、エラー0。なお、画面が固まる症状はこちらの環境では再現できていない（戻る操作の処理は約0.1秒以内）。"},{v:95,d:"2026-11-25",t:"13:14",s:"解説に「注意：現行法との違い」の囲みを追加。問題文・選択肢・正解・訂正の箱・各選択肢の解説は変えていない。出題時の基準で答える問題と、いまの法令とは違う記述がある問題に、回答後の解説の「要点」の上へオレンジ色の囲みを出す（12問）。①燃料タンクの注入口・ガス抜口と排気管の開口部300mm（令和3年9月30日施行の改正で削除）：正解の問題 平成25年度第2回ジーゼル No.38、平成27年度第1回ジーゼル No.39。選択肢に300mmが出る問題 令和3年度第2回ガソリン No.38、令和3年度第1回ジーゼル No.36、令和元年度第1回ガソリン No.38、平成29年度第2回ガソリン No.38。②小型四輪自動車の定常走行騒音85dB（現行の細目告示 第40条の85dBは、側車付二輪・三輪・カタピラ及びそり付軽自動車・大型特殊・小型特殊の基準）：平成26年度第2回ジーゼル No.38、平成25年度第2回ガソリン No.38。③自動運行装置（保安基準第48条は、2020年3月31日版では小型特殊・大型特殊を除外、現行の2025年2月28日版では除外していない）：令和4年度第2回ジーゼル No.36。④整備主任者の「1級または2級の合格者から選任」（令和2年4月1日の特定整備制度以降は、電子制御装置整備を行う事業場で2級合格者は講習の修了も必要）：平成28年度第2回ガソリン No.39、平成27年度第1回ガソリン No.39、平成30年度第2回ガソリン No.37。あわせて、要点の末尾にあった「（この問題の正解は出題時の基準による。現行の基準とは異なる。）」の5か所（h27-1-d-39、h25-2-d-38、h26-2-d-38、h25-2-g-38、r4-2-d-36）は、囲みと重複するため削除した。確認：390px幅で全2,160問の横はみ出し0、図440枚すべて読み込み成功、エラー0。出典は国土交通省の保安基準・細目告示・自動車技術総合機構の改正資料（取得日2026-11-25）。"},{v:94,d:"2026-11-25",t:"12:35",s:"説明文の補強。問題文・選択肢・正解・訂正の箱は変えていない。①選択肢の文をそのまま写しただけで理由がなかった説明文のうち、26か所（25問）を書き直した。同じ内容の選択肢は、回が違っても同じ文にそろえた。書き直しには、その問題の要点・ほかの選択肢の解説・ほかの回の解説に出ている事実だけを使い、新しい事実は足していない。対象：平成25年度第1回ジーゼル No.29、平成25年度第1回ガソリン No.39、平成25年度第2回ジーゼル No.5、平成25年度第2回ガソリン No.22、平成26年度第1回ジーゼル No.11、平成26年度第1回ジーゼル No.28、平成26年度第1回ガソリン No.18、平成26年度第2回ジーゼル No.18、平成27年度第1回ガソリン No.40、平成27年度第2回ガソリン No.38、平成28年度第1回ジーゼル No.18、平成28年度第2回ガソリン No.14、平成29年度第1回ガソリン No.19、平成29年度第1回ガソリン No.38、平成29年度第2回ジーゼル No.18、平成29年度第2回ガソリン No.20、平成30年度第1回ガソリン No.12、令和1年度第1回ジーゼル No.18、令和1年度第2回ガソリン No.29、令和3年度第1回ガソリン No.27、令和4年度第2回ガソリン No.36、令和5年度第2回ジーゼル No.11、令和7年度第1回ジーゼル No.11、令和7年度第1回ガソリン No.18、令和7年度第1回ガソリン No.30。（書き直す材料が過去問に見つからなかった4か所は、そのまま残した。令和5年度第1回ジーゼル No.28、令和4年度第2回ジーゼル No.25、平成27年度第1回ガソリン No.8、平成25年度第2回ジーゼル No.20）。②選択肢ごとの説明文がなかった11問に、誤りの選択肢の説明文を補った（正しい選択肢には、すでに補足の説明があるため補っていない）。訂正の箱と補足にある内容を、理由が分かる文にした。計算問題（ブレーキの油圧、スイッチの接触抵抗）の説明は、すでにある式と数値だけで書いた。対象：令和1年度第1回ジーゼル No.33、令和1年度第1回ジーゼル No.34、令和1年度第1回ジーゼル No.9、令和1年度第2回ジーゼル No.10、令和5年度第2回ジーゼル No.23、令和5年度第2回ジーゼル No.38、令和6年度第1回ジーゼル No.11、令和6年度第1回ジーゼル No.31、令和7年度第1回ジーゼル No.23、令和7年度第1回ジーゼル No.33、令和7年度第2回ジーゼル No.13。"},{v:93,d:"2026-11-25",t:"12:21",s:"全2,160問の点検で見つかった誤りを直した。問題文・選択肢・正解は変えていない。①図を4枚追加した。ホール素子の図（令和2年度第1回 No.9、令和3年度第2回 No.8。公式PDFにある図が抜けていた）、スタータの出力の表（令和3年度第1回 No.12 の単位表）、バルブタイミングの表（平成27年度第1回 No.6 の諸元表）。図のある問題は436問から440問になった。②訂正の箱の壊れを直した。タイヤの偏平率（令和7年度第2回 No.19 選択肢2、令和6年度第1回 No.21 選択肢4、令和4年度第2回 No.20 選択肢3）で、正しい側の文が「「断面高さ」だけになっていたのを、「「断面高さ」を「断面幅」で除した」に直した。空気過剰率（平成25年度第2回 No.1 選択肢2）も、正しい側を文として読める形にした。③上の偏平率2問（令和6年度第1回 No.21、令和4年度第2回 No.20）の要点にある「他の過去問」の引用が壊れていたので直した。④試験に出ていない記述を削除した。「（車両法第58条）」（平成28年度第2回 No.38 選択肢3）と、「（三輪は18％）」（平成26年度第2回 No.38 選択肢1〜3）。⑤表記をそろえた。解説と要点の「CAN_H・CAN_L」を「CAN-H・CAN-L」に統一した（解説23か所、要点12問）。令和2年度第2回 No.2 選択肢2 の訂正の箱の「ディーゼル」を「ジーゼル」に直した。電解液の「比重約1.29・氷点約−73℃」は、確認できたので変更しない。"},{v:92,d:"2026-11-25",t:"10:23",s:"①検索の問題詳細（検索結果から開いた1問の画面）で、ページを更新しても一覧に戻らず、同じ問題の画面のままになるようにした。選んだ選択肢・開いた解説・検索の条件もそのまま残る。更新後に「戻る」を押すと、検索結果の一覧に戻る。②勉強画面の「重複問題を除く」の判定を、「問題文と選択肢の文章が一致するもの」に変更した（選択肢の順番だけ違うものも同じ問題とみなす。図は見ない。同じ図でも年度ごとに切り出しの大きさが違うため、確認したうえで外した）。これまでは図の画像まで同じことを条件にしていたため、同一とみなす問題が少なかった。同一とみなす問題は、363組・897問から434組・1,082問に増えた（図が別の問題はなかった）。重複を除いたときの出題対象は、2,160問のうち1,512問になる。問題文・選択肢・正解は変えていない。"},{v:91,d:"2026-11-24",t:"18:15",s:"勉強画面の重複除外のスイッチを、「重複しても大丈夫」から「重複問題を除く」に変更し、「条件を指定して出題」の「この条件で始める」の下に移した。チェックが入っているときは、同じ問題を1問だけ出す（初期状態）。チェックを外すと、同じ問題も出る。以前の「重複しても大丈夫」とは、オンとオフが逆になっている（外した状態が、これまでの「重複しても大丈夫」にあたる）。「条件を指定して出題」を閉じていても、すぐ下にスイッチが見える。上の「すぐに始める」（おまかせ・未回答・間違えた・お気に入り）にも同じ設定が効く。続きの一覧の条件には、チェックを外して始めたとき「重複を除かない」と表示する。"},{v:90,d:"2026-11-24",t:"18:20",s:"①勉強モードに「重複しても大丈夫」のスイッチを追加。初期状態はオフで、完全に同じ問題（問題文・4つの選択肢・正解・図が同じもの。選択肢の順番だけ違うもの、全角半角や読点の表記だけ違うものも含む）は、1問だけ出す。2,160問のうち、同じ問題の組は363組・897問あり、重複を除くと1,626問になる。同じ問題は、条件に合うもののうちからランダムに1つ選ぶので、特定の年に偏らない。ガソリンとジーゼルで同じ問題が出ているものも重複として扱う。「重複しても大丈夫」をオンにすると、これまでどおり2,160問すべてが対象になる（設定は保存される）。「未回答」は、同じ問題をどれか1問でも解いていれば、解いた扱いにする。対象は、すぐに始める（おまかせ・未回答・間違えた・お気に入り）、条件を指定して出題、記録画面の分野別の10問出題。記録画面の「間違えた問題」「お気に入り」の一覧と、模試・検索・記録の集計は、これまでどおり2,160問で数える。②実施年を範囲で指定するとき、開始年を終了年より後にすると、これまでは両方が同じ年になって1年分しか出なかった。開始年と終了年を自動で入れ替えて、指定した期間の全体から出題するようにした。出題そのものは、期間内のどの年からも均等にランダムに選ばれることを測定で確認済み（2018〜2022年で5年とも均等）。問題文・選択肢・正解・解説は変更なし。"},{v:89,d:"2026-11-24",t:"17:57",s:"①少し難しい問題452問に「要点」の枠を追加（今回は、同じ問題が複数回出ているもの173件。ガソリン・ジーゼル合わせて、CAN通信、鉛バッテリ、予熱装置、エアコン、AT・CVT、差動制限、ホイール・タイヤ、コンロッド・ベアリング、ピストン・リング、スキャン・ツール、エア・サスペンション、燃料・軽油などの、用語の取り違え・数値の覚え間違いが出やすい問題）。要点には、実際の試験で選択肢に出た内容だけを書いています。②要点の「他の過去問」の書き方を変更。「令和7年度第2回（ガソリン）・…ほか14回」のように年度と回を並べるのをやめ、「同じ内容の問題は、ほかに○問あります」と件数で表示。別の回で言い換えて出た誤りの選択肢があれば、「「A」（正しくは「B」）という形で出ています」と例を載せます。この変更は、すでにあった法規の要点266問にも反映しました。問題文・選択肢・正解は変えていません。"},{v:88,d:"2026-11-24",t:"17:41",s:"①ページを更新（再読み込み）すると、勉強・模試の途中でも最初の画面に戻ってしまう問題を直した。更新しても、解いていた問題の画面（何問目か、回答済みの内容も）、結果画面、模試の詳細画面にそのまま戻る。②勉強モードの「続きから」を、条件ごとに複数保存して管理できるようにした。勉強の画面の一番上に「続きから：おまかせ10問・ガソリン・ジーゼル　2 / 10問 回答済み」のように、条件・進み具合・日付を表示し、押すとその続きから再開する。違う条件で始めても上書きされず、別の続きとして残る（最大30件、新しい順に3件を表示し、残りは「ほか○件の続きを表示」で開く）。各行の右の×で削除でき、削除前に確認が出る（正答・間違いの記録は消えない）。解き終えた続きは自動で消える。1問も回答せず動いてもいない練習は、続きとして残さない。これまでの1件だけの保存は引き継ぐ。模試の続きは従来どおり。問題文・選択肢・正解・解説は変更なし。"},{v:87,d:"2026-11-24",t:"17:35",s:"勉強・模試の問題画面の一番下に、JASPA公式サイトのPDFへのリンクを追加した。「JASPA公式PDF（令和4年度 第1回）：問題｜解答」の形で、小さな薄い灰色の文字。その回・その資格（ガソリン／ジーゼル）の問題PDFと、解答PDFが開く。検索の問題詳細には付けていない。問題文・選択肢・正解・解説は変更なし。"},{v:86,d:"2026-11-24",t:"17:16",s:"検索画面に、キーワード・実施年・実施月のリセットボタンを追加した（タグとNo.のリセットは以前からある）。それぞれの入力欄の右下に置き、入力がないときは薄く表示される。「全てをクリア」の動作は変更なし。問題文・選択肢・正解・解説は変更なし。"},{v:85,d:"2026-11-24",t:"17:10",s:"「問題文と選択肢をコピー」で、先頭に「令和4年度 第1回 二級ジーゼル No.1」のように、年度・回・資格・問題番号を付けるようにした。問題文・選択肢・正解・解説は変更なし。"},{v:84,d:"2026-11-24",t:"14:27",s:"問題画面（模試・練習・復習）のコピーボタンの下に、勉強・検索・模試・記録の切り替えボタンを追加した。画面に追従せず、内容の一番下に固定。押すと、×を押したときと同じく、その画面へ移る（模試の途中なら中断扱い）。いまのモードのボタンは色が付く。検索の問題詳細には付けていない。問題文・選択肢・正解・解説は変更なし。"},{v:83,d:"2026-11-24",t:"14:14",s:"公開先をGitHub Pagesに移し、表示を高速化し、ホーム画面への追加に対応した。①公開先：今後の更新はGitHub側（https://endohiroshi4008-hash.github.io/seibi-kakomon/）で行う。学習記録はURLごとに別なので、Claude上のサイトや単体ファイルで付けた記録は引き継がれない。②高速化：1ファイルを分割し、図は開いた問題の分だけ、ひらがな検索のデータは検索を使うときだけ読み込む。初回は約26秒から約2.5秒、2回目以降は約0.6秒（スマホ回線を想定した私の環境での測定値で、実機での値ではない）。文字（BIZ UDPゴシック）は使う文字だけを切り出して同じ場所に置き、外部から読み込まない。検索の索引は初めて検索するときに作る。③オフライン：一度開けば、電波がなくても開ける。④自動更新：開くたびに版番号だけを確認し、新しい版があれば自動で入れ替わる。古い版が出たときは、一度閉じて開き直す。⑤ホーム画面：Chromeの「︙」→「ホーム画面に追加」（または「アプリをインストール」）で、アドレスバーなしの全画面で開く。アイコンは青緑の地に白の「整」。アイコンから開いたときに学習記録がブラウザーと共有されるかは、端末により異なる可能性があり未確認。問題文・選択肢・正解・解説・画面の見た目は変更なし（旧版と新版の画面をピクセル単位で比べて一致を確認）。"},{v:82,d:"2026-11-24",t:"12:33",s:"数字・条番号の点検で、過去問に出ていない記述を説明から削除した。告示第206条・第10条・保安基準第48条の2・法第4条などの条番号（9か所）、「比重は20℃基準で1.28が充電率100%」（h25-2-g-15）、「アルミ（約2.7）」（r5-1-d-20）。問題文・選択肢・正解は変更なし。"},{v:81,d:"2026-11-24",t:"12:08",s:"ラジアル・ベアリングの問題6問（r8-1-g-31、r6-2-g-32、r2-2-g-35、h30-1-g-33、h27-2-g-32、h26-1-g-33）の説明文を直した。「ラジアル・ベアリングには、ボール型、ニードル・ローラ型、シリンドリカル・ローラ型がある。テーパ・ローラ型は、アンギュラ・ベアリングである。」にそろえた。問題文・選択肢・正解は変更なし。"},{v:80,d:"2026-11-24",t:"10:48",s:"インタ・アクスル・デフの問題（h28-1-d-18、h29-2-d-18、h26-2-d-18 の選択肢）の訂正を直した。「フロント側のサイド・ギヤにドライブ・ヘリカル・ギヤが噛み合う」は、「後後軸→後前軸」だけでなく「フロント側→リヤ側」も誤り（フロント側にはアウトプット・シャフトが結合して後後軸へ、リヤ側にドライブ・ヘリカル・ギヤが結合して後前軸へ伝える）。スキャン・ツールのコード消去（r4-1-d-26）の訂正語句を「故障コード消去の機能」に直した。問題文・選択肢・正解は変更なし。"},{v:79,d:"2026-11-24",t:"09:01",s:"解説の一番上の訂正の箱（誤りが赤、正しい語句が緑）で、文全体を赤→緑にしていたものを、違っている語句だけに絞った。例：エア・スプリングの問題は「ベローズ→ダイヤフラム」「ダイヤフラム→ベローズ」の2行だけにした。対象は、エア・ヒータとグロー・プラグ（小型車・大型車）、RAMとCPU、CAN（ドミナント・レセシブ）、ABSの通電ON・OFF、CVTのプーリ、油性・粘度、比重と氷点、空気過剰率など、約110か所（約70種類の文）。問題文・選択肢・正解、説明文は変更なし。"},{v:78,d:"2026-11-24",t:"08:45",s:"過去問のどの選択肢にも出てこない「作り話」の疑いがある解説文を、2,160問を機械的に調べて洗い出し、確認できた分を過去問の文言に合わせて直した。直したのは次のとおり。補助制動灯の数（平成27年度第2回 No.38・平成26年度第1回 No.38）：「原則1個（中央に付けにくければ2個）」→過去問が正しいとする「1個」。鉛（平成25年度第1回 No.33）：「保護皮膜…希硫酸には溶けにくい」→過去問どおり「空気中で容易に腐食されず、塩酸や硫酸に溶解されない」。熱損失（平成25年度第2回 No.1ほか3問）：「放射」→過去問の語「ふく射損失」。ダイオードの点検（平成29年度第2回・平成28年度第1回・平成27年度第2回・平成26年度第1回 No.14）：「一方向が低抵抗、逆方向が高抵抗」→過去問の「逆に当てたときの抵抗値との差が非常に大きければ正常」。サブクール方式の冷媒充てん（平成25年度第2回・平成27年度第1回・平成28年度第2回 No.27）：「メーカー指定の規定量」→過去問の「泡消え点で止めると冷房能力が不足気味になる／泡消え点から更に50～100g補充」。SRSエア・バッグの点検（平成25年度第1回 No.29）：「メーカー指定の方法と点検器具」→過去問の「デジタル・サーキット・テスタを使用する」。問題文・選択肢・正解は変更なし。"},{v:77,d:"2026-11-24",t:"08:33",s:"突入防止装置の問題3問（令和8年度第1回 No.38、令和6年度第2回 No.38、令和5年度第1回 No.37）の解説を、Version 76 の前の状態に戻した。V76で「450mmと断定する説明」を削除したが、「他の過去問で550mmが正しい値になっていなければ450mmと断定する」というユーザーの指示に反していたため。他の回に550mmを正しい値とする選択肢はない。V76のほかの修正（フレーム亀裂5問の訂正文、ライト警報2問の誤植）はそのまま。問題文・選択肢・正解は変更なし。"},{v:76,d:"2026-11-24",t:"08:32",s:"ジーゼルの外部資料確認（第3弾：令和8年10月No.24〜40、シャシ、整備機器等、法規の代表問題）。教科書基準のブログ記事と、現行の細目告示（国土交通省）で照合し、次の3点を直した。(1) 突入防止装置の問題（令和8年度第1回 No.38、令和6年度第2回 No.38、令和5年度第1回 No.37）：「空車状態で地上450mm以下であり、550mm以下ではない」と書いていたが、現行の告示では下縁の高さは車両の条件により450mm・500mm・550mm以下に分かれる（550mmは車両総重量8t以下などの車両）ため、この断定を削除した。誤りの理由は「積車状態ではなく空車状態で判断する」ことだけにした。(2) フレームの亀裂の問題5問（令和8年度第1回 No.24、令和7年度第1回 No.25、令和5年度第1回 No.25、令和3年度第2回 No.25、平成29年度第2回 No.25）：訂正文の「亀裂の原因を調べ…必要な補強を行う」はどの回の選択肢にもない当サイトの言い回しだったため、他の回の正しい選択肢どおり「当て板を当てるだけの修正は行わない」に統一した。(3) ライト消し忘れ警報装置2問（令和7年度第2回 No.30、令和5年度第1回 No.30）の誤植を直した。問題文・選択肢・正解は変更なし。"},{v:75,d:"2026-11-24",t:"08:21",s:"ジーゼルの外部資料確認（第2弾：始動・予熱、エンジン性能、燃焼・ノック、排出ガス、燃料装置・コモンレール、潤滑、バルブ機構、吸排気）。教科書基準のブログ記事と照合し、食い違いは1か所だけだった。「ネット軸出力」（令和7年度第2回 No.1ほか10問）の解説で、以前は「実車に搭載する状態（排気系・補機類を含む）で測る」と書いていたが、教科書の記述どおり「特定の用途に必要な付属装置をすべて装着して、エンジン試験台で測定した軸出力」に直した。問題文・選択肢・正解は変更なし。"},{v:74,d:"2026-11-24",t:"08:13",s:"ジーゼルの外部資料確認（第1弾：ピストン・リング・ライナ）の結果を反映。①「アルミニウム合金ピストンは、熱伝導性、耐摩耗性に優れ、熱膨張係数が小さく、一般にトラックなどの大型エンジンに用いられる」の問題（令和元年度第2回 No.5、平成30年度第1回 No.5）の解説を訂正。以前は「熱膨張係数が大きい。『小さい』が誤り」としていたが、教科書の記述（小型エンジンのアルミ合金は熱膨張係数が小さい）に合わせ、誤りは「大型エンジンに」の部分（正しくは乗用車などの小型エンジン）に直した。②「ターボ・チャージャを装着したエンジンでは、アルミニウムを鋳造したピストンを用いる」の問題（令和5年度第1回 No.4、令和6年度第2回 No.4、令和8年度第1回 No.4）の解説と訂正の箱を、教科書の記述に合わせて「鋳鉄製や鋼を鍛造したピストン」に直した。問題文・選択肢・正解は変更なし。"},{v:73,d:"2026-11-24",t:"07:47",s:"ピストン・リングの「バレル・フェース型…吸入行程では線接触し、燃焼（膨張）行程では高い面圧で密着…一般にセカンド・リングに用いられている」の問題（令和5年度第1回 No.1、令和6年度第2回 No.3、令和8年度第1回 No.1、ガソリン）の解説を訂正。誤りは「セカンド・リング」で、正しくは「トップ・リング」（セカンド・リングに用いられるのはアンダ・カット型）。以前は誤りを「バレル・フェース型→インナ・カット型」と説明していた。問題文・選択肢・正解は変更なし。"},{v:72,d:"2026-11-24",t:"07:39",s:"問題を解く画面を2点変更。①上の「進み具合」の帯（×・進み具合の線・1/40・★）を、年度・No.の右のボタン（進み具合・中断）で開閉できるようにした。初めは閉じていて、開閉の状態は覚える。②「前へ／次の問題」は、上にいるときはこれまでどおり画面の下に固定。最後までスクロールすると、選択肢（解説を開いているときは解説）の下に収まり、その下に「問題文と選択肢をコピー」が来る。検索の問題詳細も同じ形にした。"},{v:71,d:"2026-11-24",t:"07:26",s:"下のタブ（勉強・検索・模試・記録）を切り替えたあとに「戻る」を押すと、直前に見ていたタブに戻るようにした。例：検索から模試へ移って戻ると検索に戻る。以前は、タブの切り替えは履歴に積まず、戻るとサイトから出ていた。"},{v:70,d:"2026-11-23",t:"22:22",s:"「戻る」の対応を広げた。検索画面の「履歴」の候補と、記録画面の「データを消去」の確認も、戻るボタンでその表示だけ閉じるようにした。候補を開いたまま下のタブを押しても、戻るの動きがずれない。"},{v:69,d:"2026-11-23",t:"21:46",s:"ブラウザーやスマホの「戻る」で、1つ前の画面に戻るように修正。これまでは、検索の問題詳細・結果画面・図の拡大・問題番号の一覧・更新履歴が「戻る」の履歴に入っておらず、戻ると大きく前の画面へ飛んだりサイトから出たりしていた。いまは、検索の詳細→検索一覧（スクロール位置も戻る）、番号一覧や図の拡大→問題、問題→元のタブ、結果→元のタブ、模試の問題→模試の詳細→模試一覧、更新履歴→記録、の順に戻る。「×」「戻る」ボタンを押したあとに「戻る」を押しても、いた画面へ戻らない。下のタブの切り替えは履歴に積まない（タブだけなら戻るでサイトから出る）。"},{v:68,d:"2026-11-23",t:"21:39",s:"法規の説明から、国家試験に出ていない補足を削除。要点の欄は「試験で問われた事実」と「他の過去問での出題」だけにした。現行法の細かい説明（騒音の別基準、第48条、第18条の条文番号など）は削除し、現行法と食い違う3問（騒音・自動運行装置・排気管300mm）には「この問題の正解は出題時の基準による。」の一行だけ残した。選択肢ごとの説明も、試験で問われた内容だけにした。小型自動車の大きさ、整備士の人数の表なども、出題された値だけに絞った。"},{v:67,d:"2026-11-23",t:"21:35",s:"燃料タンクの注入口及びガス抜口の2種類の問題を区別して説明を整理。「電気端子・電気開閉器から200mm以上」の問題と、「排気管の開口部から300mm以上」の問題を、要点・他の過去問の行も別々にした。現行の細目告示第18条には排気管300mmの規定が確認できないため、排気管の問題には「正解は300mm（出題時）、現行法では確認できない」と明記。"},{v:66,d:"2026-11-23",t:"21:29",s:"法規の全270問を、現行法（国交省の告示・e-Gov）と他の過去問に照らして点検。解説の下の「要点」を、項目ごとの完結した一文（例：番号灯は白色で、夜間後方20mから確認でき…）に統一し、「他の過去問：この項目は他に◯回出ている（…）。誤りの選択肢には…」の行を追加。突入防止装置の下縁は空車状態で地上450mm以下と断定（他の過去問に550mmを正しいとする選択肢がないため）。「出題当時」と書いていた説明を現行法の言い方に直し、騒音の85dBと自動運行装置の小型特殊自動車は、出題時の正解と現行法が異なる旨を明記。"},{v:65,d:"2026-11-23",t:"21:11",s:"突入防止装置（後部）の下縁の高さの解説を修正（3問）。国の細目告示では空車状態で地上450mm以下が基本で、車両総重量8t以下の自動車などは550mm以下でよいため、「550mm以下とする」と言い切っていた説明を直しました。"},{v:64,d:"2026-11-23",t:"21:08",s:"問題の数え方を、収録の全2,160問（ガソリン1,080問・ジーゼル1,080問）を基本にする方式に戻しました。別の回に同じ問題が出ていても、回ごとに別の問題として数えます（V63の「同じ問題をまとめて数える」を取りやめ）。V63の法規の解説の修正はそのまま残っています。"},{v:63,d:"2026-11-23",t:"21:02",s:"法規の解説を、整備士の法令まとめ資料（2級自動車整備士／法令のまとめ）と照合して修正：点検整備記録簿の保存期間の説明（事業用・自家用貨物は1年、自家用乗用は2年）、特定整備のかじ取り装置の記述、「完了した年月日」への統一、軽自動車の登録の説明。別の回に同じ問題が出ている場合は、どの回で解いても解いた問題として数えるよう変更（未回答・間違えた問題・進み具合・出題。同じ問題が1回の練習で重複して出ることもなくなりました）。これまでの学習記録はそのまま使えます。問題文・選択肢・正解は変更なし"},{v:62,d:"2026-11-23",t:"18:17",s:"文章で答える問題の解説を全文読み直し。誤りの修正、同じ内容の選択肢で説明文と訂正の箱の言い回しを統一（クラッチ容量、懸架装置、パワー・ステアリング、リミテッド・スリップ・デフ、ブレーキ、タイヤ、SRS、CAN、日常点検、特定整備、添加剤、オクタン価など）。根拠を確認できない記述は削除するか断定しない表現に変更。問題文・選択肢・正解は変更なし"},{v:61,d:"2026-11-23",t:"17:12",s:"模試の40問を解き終えた結果に「合格／不合格」を表示（40点中28点以上、かつ各分野が責任点以上）。分野ごとの得点と責任点も表示。検索画面の押しにくさを修正：キーワードを入れた直後に「全てをクリア」が押せない状態のままになる不具合を直し、検索窓の余白・「全てをクリア」・月の切り替えの押せる範囲を広げた。ギヤ・オイルの粘度（できるだけ低いもの）とカム角センサー（凹部）の解説を修正"},{v:60,d:"2026-11-23",t:"16:22",s:"計算・図・組み合わせなど、問題文と選択肢だけでは分かりにくい254問に「要点」を追加。あわせて問題文・選択肢・解説を読み合わせ、選択肢と合わない説明や他の年度と食い違う解説25か所、意味のない訂正の箱3か所、計算の手順の誤記・不要な定型文29か所を修正"},{v:59,d:"2026-11-23",t:"16:07",s:"選択肢ごとの解説がなかった295か所（正解の選択肢250・不正解45、主にジーゼルの図・計算・法規の問題）に解説を追加し、全2,160問・8,640選択肢すべてに解説がそろった。別の問題向けの文が紛れていた解説3か所も修正。あわせて、解説データを1つのファイルにまとめ、7段階の上書きをなくした（表示は変わらない）。"},{v:58,d:"2026-11-23",t:"15:57",s:"点検にもとづく整理と軽量化。問題データから画面で使わない項目と重複した解説文をまとめて約12％軽く（3.45MB→3.03MB）。検索の「よみ」データ（1.9MB）は、ひらがなで探すときだけ読むように。重なっていた見た目の指定と使っていないコードを削除。選択肢ごとの解説がない選択肢で解説欄が空になっていたのを、問題全体の要点を代わりに出すよう修正。回答後の「✕ 不正解／✓ 正解」の札の文字が背景と同じ色で読めなかった不具合も修正。"},{v:57,d:"2026-11-23",t:"14:10",s:"出題画面（模試・練習・復習）の上の「4 / 40」を押すと、1〜40の番号の一覧が開き、押した番号の問題へすぐ移動できるようにした。番号は正解（緑）・不正解（赤）・未回答・いまの問題が分かる色分け。"},{v:56,d:"2026-11-23",t:"14:05",s:"問題文と選択肢を、背景と区別できる白い面（細い枠）に置いた（「以前の緑」は薄いグレー）。問題文と選択肢の文字を、ほかの文字より少し濃く・少し大きくした。"},{v:55,d:"2026-11-23",t:"14:00",s:"見た目を落ち着いた形に戻した：影をなくし、枠は細く、文字と見出しを小さめに、選択肢は枠なしの薄いグレーの箱と「(1)」の番号に。正解・不正解の札も塗りつぶしをやめて細い枠に。記録 › 表示 に「デザイン」を追加し、青緑（標準）・モノトーン・和紙・以前の緑の4つから選べるようにした。検索の「全てをクリア」を常に表示。"},{v:54,d:"2026-11-23",t:"13:16",s:"検索画面を作り直し。「条件を組み合わせて検索」の枠に、検索窓（履歴・検索ボタン付き）、「問題文だけを検索」、資格区分（2級ガソリン・2級ジーゼル）、開閉できる「実施年月・番号・タグ」（タグと問題番号を横並びにして、それぞれにリセットボタン、実施年、実施月）をまとめた。タグは分野ごとのテーマ（例：動弁機構、ブレーキ）と、図のある問題・計算問題でも絞り込める。"},{v:53,d:"2026-11-23",t:"13:06",s:"配色を変更。生成りの白地に墨色の文字、メインのボタンは墨色、選択中や強調は深い藍、正解・不正解は落ち着いた緑とれんが色、ガソリン・ジーゼルの札も彩度を抑えた色にした。"},{v:52,d:"2026-11-23",t:"13:04",s:"デザイン刷新（第3段）。ホームと練習を「勉強」1画面に統合し、下のメニューを4つ（勉強・検索・模試・記録）に。勉強は「おまかせで10問」と未回答・間違えた・お気に入りをすぐ押せる形にし、細かい条件は「条件を指定して出題」に畳んだ。模試一覧は各回1行で、ガソリン・ジーゼルの状況（未実施・途中・点数）が一目で分かる形に。文字の大きさの切り替えは記録タブの「表示」へ移動。"},{v:51,d:"2026-11-23",t:"13:01",s:"デザイン刷新（第2段）。検索を作り直し：検索窓と絞り込み（ガソリン・ジーゼル・分野・実施回・No.）を上に固定し、結果を詰めて一覧表示。実施年・月の指定は「令和◯年度 第◯回」の1つにまとめた。検索から開いた問題は、上に「‹ 検索結果」と番号、下に前後の移動を固定。"},{v:50,d:"2026-11-23",t:"12:59",s:"デザイン刷新（第1段）。配色・書体（BIZ UDPゴシック）・ボタン類を一新。出題画面（練習・模試・復習）を作り直し：問題文はカードから出して読みやすく、選択肢は番号の丸付きカード。回答すると正解・不正解の札が付き、選んだ選択肢と正解の解説がそのすぐ下に開く（タップで開閉）。年の表記を「令和◯年度 第◯回」に統一。"},{v:49,d:"2026-11-23",t:"12:38",s:"問題の画面（練習・模試・復習・検索から開いた問題）の上のほうに、問題文と選択肢をコピーするボタンを追加。横幅いっぱいで押せる。"},{v:48,d:"2026-11-23",t:"12:27",s:"適切な選択肢の解説から、他の年度の選択肢向けの補足（※「◯◯」は誤り、など）を削除（209件）。その選択肢自体の解説だけにした。不適切な選択肢の「どこが誤りか」の補足は残している。"},{v:47,d:"2026-11-23",t:"12:21",s:"令和7年度第1回ガソリンNo.13の選択肢(3)の解説から、内容と合わない一文（※「1回」は誤り）を削除。"},{v:46,d:"2026-11-23",t:"12:22",s:"検索の回答表示を2つに分けた。「回答を開く」は従来どおり問題の下に答えと各選択肢の解説をまとめて表示。これとは別に、選択肢をタップするとその選択肢のすぐ下に解説が出る（もう一度タップで閉じる）。"},{v:45,d:"2026-11-23",t:"12:20",s:"検索の回答表示をさらに見分けやすく変更。選択肢は青みのある灰色の見出しに丸い番号・太字、正解には「正解」の札。解説は白地で少し小さい字にした。"},{v:44,d:"2026-11-23",t:"12:16",s:"検索の回答表示を見分けやすく変更。選択肢と解説を1つの枠にまとめ、解説側に「解説」の見出しと適切／不適切の色付き線を付けた。"},{v:43,d:"2026-11-23",t:"12:13",s:"検索から開いた問題で「回答を開く」を押すと、各選択肢のすぐ下にその解説が出る形に変更（選択肢→解説→次の選択肢…の順）。選択肢をタップするとその解説だけ閉じる。余白も少なめに。"},{v:42,d:"2026-11-23",t:"12:04",s:"画面の余白を詰めた（左右の余白、問題カード・選択肢の内側、解説の行間）。検索から開いた問題で、選択肢をタップしても色が変わらないようにした。"},{v:41,d:"2026-11-23",t:"08:41",s:"模試一覧を「年度・第◯回」で並べるよう変更（これまでは西暦の暦年で区切っていたため、3月実施の第2回が翌年に入っていた）。全27回（ガソリン・ジーゼル各27回）と表示。"},{v:40,d:"2026-11-23",t:"08:40",s:"文章問題の解説を全件見直し、約110問を修正。電動ファン回路の低速時の電圧計表示は「約6V（試験の定石）」に統一。説明の逆転・誤字、根拠のない数値や条文番号も直した。"},{v:39,d:"2026-11-23",t:"08:24",s:"解説の内容チェック：要点・図の補足（約730件）と図問題の選択肢解説を見直し、誤り（電動ファン電圧計、ライト消し忘れ警報のリレー、エア・油圧式ブレーキ、タイヤ摩耗の原因、ATの締結要素など）を修正。作業メモ調の文や崩れた言い回しも直した。"},{v:38,d:"2026-11-23",t:"08:12",s:"全27回分（2,160問）の正解番号を公式の解答PDFと照合し、すべて一致を確認（全員正解の2問はサイトの訂正版を採用）。ピストン・リング（バレル・フェース型）の解説の訂正文を修正。令和2年度第1回ジーゼルNo.1の図（指圧線図）の網かけを見やすく清書。"},{v:37,d:"2026-11-23",t:"07:53",s:"Ver.32以前の更新内容を履歴に追記。"},{v:36,d:"2026-11-23",t:"07:50",s:"「更新履歴」ページを追加（記録タブの下から開けます）。"},{v:35,d:"2026-11-23",t:"07:45",s:"ジーゼルの図問題に、選択肢ごとの解説を338件追加。電動ファンの電圧計など、要点に誤りがあった問題を修正。"},{v:34,d:"2026-11-23",t:"07:43",s:"図の清書（背景を白く、線をくっきり、2倍に拡大）を全436問に反映。"},{v:33,d:"2026-11-23",t:"",s:"追加11回分の図を含め、図が必要な436問すべてを取り込み。"},{v:"32以前",d:"2026年11月22〜23日",t:"",s:"検索モードを追加。問題文の一覧から問題詳細ページへ移動し、「回答を開く」で答えと選択肢ごとの解説を表示。ひらがな・カタカナ・漢字のどれでも検索でき、「適切」で探したときは不適切問題を除外。"},{v:"32以前",d:"2026年11月22〜23日",t:"",s:"画面を全面的に改修。参考画面に合わせた配色・選択肢のデザイン、解説の開閉、文字サイズの切り替え、下部メニューの自動非表示。"},{v:"32以前",d:"2026年11月22〜23日",t:"",s:"解説の整理。作業メモのような文言の除去、文体の統一、解説がなかった選択肢（ライト消し忘れ警報・論理回路など）の補完、「考えられない」型3問の○×の向きをそろえた。"},{v:"32以前",d:"2026年11月22〜23日",t:"",s:"ジーゼル全問に解説を追加（文章の選択肢は個別、図・数値・組み合わせの問題は要点＋選択肢別の自動解説）。"},{v:"32以前",d:"2026年11月22〜23日",t:"",s:"JASPAが「全員正解」とした問題は、整備士ドットコムの訂正後の問題文・選択肢・正解をサイトに採用。"},{v:"32以前",d:"2026年11月22〜23日",t:"",s:"ガソリンの解説を新形式に変更。選択肢ごとに判定バッジ、誤「…」→正「…」、短い解説を表示。"},{v:"32以前",d:"2026年11月22〜23日",t:"",s:"初版を公開。勉強モード（資格・出題範囲・出題数の条件、履歴・お気に入り）と模試モード（年・実施月ごとの本番形式40問、学校プリントのチェック）。タップした選択肢の下に答えと解説を表示。"}],APPV="e1915c9f67",boot=t=>{const s=t.q,a={};s.forEach(t=>a[t.id]=t);const n="seibi2:",e={},l={g(t,s){try{const a=localStorage.getItem(n+t);return a?JSON.parse(a):s}catch(t){return s}},s(t,s){try{if(null==s)null!==e[t]&&(localStorage.removeItem(n+t),e[t]=null);else{const a=JSON.stringify(s);e[t]!==a&&(localStorage.set
