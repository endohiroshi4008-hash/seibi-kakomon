<script>const LOG=[{v:83,d:"2026-11-24",t:"14:14",s:"表示の高速化とホーム画面への追加に対応した。ファイルを分けて必要な分だけ読み込む形にし、2回目以降は端末に保存した分から開く。初回は約26秒から約2.5秒、2回目以降は約0.6秒（スマホ回線を想定した私の環境での測定値）。電波がなくても開ける。ホーム画面に追加すると、アドレスバーなしの全画面で開く。問題文・選択肢・正解・解説は変更なし。"},{v:82,d:"2026-11-24",t:"12:33",s:"数字・条番号の点検で、過去問に出ていない記述を説明から削除した。告示第206条・第10条・保安基準第48条の2・法第4条などの条番号（9か所）、「比重は20℃基準で1.28が充電率100%」（h25-2-g-15）、「アルミ（約2.7）」（r5-1-d-20）。問題文・選択肢・正解は変更なし。"},{v:81,d:"2026-11-24",t:"12:08",s:"ラジアル・ベアリングの問題6問（r8-1-g-31、r6-2-g-32、r2-2-g-35、h30-1-g-33、h27-2-g-32、h26-1-g-33）の説明文を直した。「ラジアル・ベアリングには、ボール型、ニードル・ローラ型、シリンドリカル・ローラ型がある。テーパ・ローラ型は、アンギュラ・ベアリングである。」にそろえた。問題文・選択肢・正解は変更なし。"},{v:80,d:"2026-11-24",t:"10:48",s:"インタ・アクスル・デフの問題（h28-1-d-18、h29-2-d-18、h26-2-d-18 の選択肢）の訂正を直した。「フロント側のサイド・ギヤにドライブ・ヘリカル・ギヤが噛み合う」は、「後後軸→後前軸」だけでなく「フロント側→リヤ側」も誤り（フロント側にはアウトプット・シャフトが結合して後後軸へ、リヤ側にドライブ・ヘリカル・ギヤが結合して後前軸へ伝える）。スキャン・ツールのコード消去（r4-1-d-26）の訂正語句を「故障コード消去の機能」に直した。問題文・選択肢・正解は変更なし。"},{v:79,d:"2026-11-24",t:"09:01",s:"解説の一番上の訂正の箱（誤りが赤、正しい語句が緑）で、文全体を赤→緑にしていたものを、違っている語句だけに絞った。例：エア・スプリングの問題は「ベローズ→ダイヤフラム」「ダイヤフラム→ベローズ」の2行だけにした。対象は、エア・ヒータとグロー・プラグ（小型車・大型車）、RAMとCPU、CAN（ドミナント・レセシブ）、ABSの通電ON・OFF、CVTのプーリ、油性・粘度、比重と氷点、空気過剰率など、約110か所（約70種類の文）。問題文・選択肢・正解、説明文は変更なし。"},{v:78,d:"2026-11-24",t:"08:45",s:"過去問のどの選択肢にも出てこない「作り話」の疑いがある解説文を、2,160問を機械的に調べて洗い出し、確認できた分を過去問の文言に合わせて直した。直したのは次のとおり。補助制動灯の数（平成27年度第2回 No.38・平成26年度第1回 No.38）：「原則1個（中央に付けにくければ2個）」→過去問が正しいとする「1個」。鉛（平成25年度第1回 No.33）：「保護皮膜…希硫酸には溶けにくい」→過去問どおり「空気中で容易に腐食されず、塩酸や硫酸に溶解されない」。熱損失（平成25年度第2回 No.1ほか3問）：「放射」→過去問の語「ふく射損失」。ダイオードの点検（平成29年度第2回・平成28年度第1回・平成27年度第2回・平成26年度第1回 No.14）：「一方向が低抵抗、逆方向が高抵抗」→過去問の「逆に当てたときの抵抗値との差が非常に大きければ正常」。サブクール方式の冷媒充てん（平成25年度第2回・平成27年度第1回・平成28年度第2回 No.27）：「メーカー指定の規定量」→過去問の「泡消え点で止めると冷房能力が不足気味になる／泡消え点から更に50～100g補充」。SRSエア・バッグの点検（平成25年度第1回 No.29）：「メーカー指定の方法と点検器具」→過去問の「デジタル・サーキット・テスタを使用する」。問題文・選択肢・正解は変更なし。"},{v:77,d:"2026-11-24",t:"08:33",s:"突入防止装置の問題3問（令和8年度第1回 No.38、令和6年度第2回 No.38、令和5年度第1回 No.37）の解説を、Version 76 の前の状態に戻した。V76で「450mmと断定する説明」を削除したが、「他の過去問で550mmが正しい値になっていなければ450mmと断定する」というユーザーの指示に反していたため。他の回に550mmを正しい値とする選択肢はない。V76のほかの修正（フレーム亀裂5問の訂正文、ライト警報2問の誤植）はそのまま。問題文・選択肢・正解は変更なし。"},{v:76,d:"2026-11-24",t:"08:32",s:"ジーゼルの外部資料確認（第3弾：令和8年10月No.24〜40、シャシ、整備機器等、法規の代表問題）。教科書基準のブログ記事と、現行の細目告示（国土交通省）で照合し、次の3点を直した。(1) 突入防止装置の問題（令和8年度第1回 No.38、令和6年度第2回 No.38、令和5年度第1回 No.37）：「空車状態で地上450mm以下であり、550mm以下ではない」と書いていたが、現行の告示では下縁の高さは車両の条件により450mm・500mm・550mm以下に分かれる（550mmは車両総重量8t以下などの車両）ため、この断定を削除した。誤りの理由は「積車状態ではなく空車状態で判断する」ことだけにした。(2) フレームの亀裂の問題5問（令和8年度第1回 No.24、令和7年度第1回 No.25、令和5年度第1回 No.25、令和3年度第2回 No.25、平成29年度第2回 No.25）：訂正文の「亀裂の原因を調べ…必要な補強を行う」はどの回の選択肢にもない当サイトの言い回しだったため、他の回の正しい選択肢どおり「当て板を当てるだけの修正は行わない」に統一した。(3) ライト消し忘れ警報装置2問（令和7年度第2回 No.30、令和5年度第1回 No.30）の誤植を直した。問題文・選択肢・正解は変更なし。"},{v:75,d:"2026-11-24",t:"08:21",s:"ジーゼルの外部資料確認（第2弾：始動・予熱、エンジン性能、燃焼・ノック、排出ガス、燃料装置・コモンレール、潤滑、バルブ機構、吸排気）。教科書基準のブログ記事と照合し、食い違いは1か所だけだった。「ネット軸出力」（令和7年度第2回 No.1ほか10問）の解説で、以前は「実車に搭載する状態（排気系・補機類を含む）で測る」と書いていたが、教科書の記述どおり「特定の用途に必要な付属装置をすべて装着して、エンジン試験台で測定した軸出力」に直した。問題文・選択肢・正解は変更なし。"},{v:74,d:"2026-11-24",t:"08:13",s:"ジーゼルの外部資料確認（第1弾：ピストン・リング・ライナ）の結果を反映。①「アルミニウム合金ピストンは、熱伝導性、耐摩耗性に優れ、熱膨張係数が小さく、一般にトラックなどの大型エンジンに用いられる」の問題（令和元年度第2回 No.5、平成30年度第1回 No.5）の解説を訂正。以前は「熱膨張係数が大きい。『小さい』が誤り」としていたが、教科書の記述（小型エンジンのアルミ合金は熱膨張係数が小さい）に合わせ、誤りは「大型エンジンに」の部分（正しくは乗用車などの小型エンジン）に直した。②「ターボ・チャージャを装着したエンジンでは、アルミニウムを鋳造したピストンを用いる」の問題（令和5年度第1回 No.4、令和6年度第2回 No.4、令和8年度第1回 No.4）の解説と訂正の箱を、教科書の記述に合わせて「鋳鉄製や鋼を鍛造したピストン」に直した。問題文・選択肢・正解は変更なし。"},{v:73,d:"2026-11-24",t:"07:47",s:"ピストン・リングの「バレル・フェース型…吸入行程では線接触し、燃焼（膨張）行程では高い面圧で密着…一般にセカンド・リングに用いられている」の問題（令和5年度第1回 No.1、令和6年度第2回 No.3、令和8年度第1回 No.1、ガソリン）の解説を訂正。誤りは「セカンド・リング」で、正しくは「トップ・リング」（セカンド・リングに用いられるのはアンダ・カット型）。以前は誤りを「バレル・フェース型→インナ・カット型」と説明していた。問題文・選択肢・正解は変更なし。"},{v:72,d:"2026-11-24",t:"07:39",s:"問題を解く画面を2点変更。①上の「進み具合」の帯（×・進み具合の線・1/40・★）を、年度・No.の右のボタン（進み具合・中断）で開閉できるようにした。初めは閉じていて、開閉の状態は覚える。②「前へ／次の問題」は、上にいるときはこれまでどおり画面の下に固定。最後までスクロールすると、選択肢（解説を開いているときは解説）の下に収まり、その下に「問題文と選択肢をコピー」が来る。検索の問題詳細も同じ形にした。"},{v:71,d:"2026-11-24",t:"07:26",s:"下のタブ（勉強・検索・模試・記録）を切り替えたあとに「戻る」を押すと、直前に見ていたタブに戻るようにした。例：検索から模試へ移って戻ると検索に戻る。以前は、タブの切り替えは履歴に積まず、戻るとサイトから出ていた。"},{v:70,d:"2026-11-23",t:"22:22",s:"「戻る」の対応を広げた。検索画面の「履歴」の候補と、記録画面の「データを消去」の確認も、戻るボタンでその表示だけ閉じるようにした。候補を開いたまま下のタブを押しても、戻るの動きがずれない。"},{v:69,d:"2026-11-23",t:"21:46",s:"ブラウザーやスマホの「戻る」で、1つ前の画面に戻るように修正。これまでは、検索の問題詳細・結果画面・図の拡大・問題番号の一覧・更新履歴が「戻る」の履歴に入っておらず、戻ると大きく前の画面へ飛んだりサイトから出たりしていた。いまは、検索の詳細→検索一覧（スクロール位置も戻る）、番号一覧や図の拡大→問題、問題→元のタブ、結果→元のタブ、模試の問題→模試の詳細→模試一覧、更新履歴→記録、の順に戻る。「×」「戻る」ボタンを押したあとに「戻る」を押しても、いた画面へ戻らない。下のタブの切り替えは履歴に積まない（タブだけなら戻るでサイトから出る）。"},{v:68,d:"2026-11-23",t:"21:39",s:"法規の説明から、国家試験に出ていない補足を削除。要点の欄は「試験で問われた事実」と「他の過去問での出題」だけにした。現行法の細かい説明（騒音の別基準、第48条、第18条の条文番号など）は削除し、現行法と食い違う3問（騒音・自動運行装置・排気管300mm）には「この問題の正解は出題時の基準による。」の一行だけ残した。選択肢ごとの説明も、試験で問われた内容だけにした。小型自動車の大きさ、整備士の人数の表なども、出題された値だけに絞った。"},{v:67,d:"2026-11-23",t:"21:35",s:"燃料タンクの注入口及びガス抜口の2種類の問題を区別して説明を整理。「電気端子・電気開閉器から200mm以上」の問題と、「排気管の開口部から300mm以上」の問題を、要点・他の過去問の行も別々にした。現行の細目告示第18条には排気管300mmの規定が確認できないため、排気管の問題には「正解は300mm（出題時）、現行法では確認できない」と明記。"},{v:66,d:"2026-11-23",t:"21:29",s:"法規の全270問を、現行法（国交省の告示・e-Gov）と他の過去問に照らして点検。解説の下の「要点」を、項目ごとの完結した一文（例：番号灯は白色で、夜間後方20mから確認でき…）に統一し、「他の過去問：この項目は他に◯回出ている（…）。誤りの選択肢には…」の行を追加。突入防止装置の下縁は空車状態で地上450mm以下と断定（他の過去問に550mmを正しいとする選択肢がないため）。「出題当時」と書いていた説明を現行法の言い方に直し、騒音の85dBと自動運行装置の小型特殊自動車は、出題時の正解と現行法が異なる旨を明記。"},{v:65,d:"2026-11-23",t:"21:11",s:"突入防止装置（後部）の下縁の高さの解説を修正（3問）。国の細目告示では空車状態で地上450mm以下が基本で、車両総重量8t以下の自動車などは550mm以下でよいため、「550mm以下とする」と言い切っていた説明を直しました。"},{v:64,d:"2026-11-23",t:"21:08",s:"問題の数え方を、収録の全2,160問（ガソリン1,080問・ジーゼル1,080問）を基本にする方式に戻しました。別の回に同じ問題が出ていても、回ごとに別の問題として数えます（V63の「同じ問題をまとめて数える」を取りやめ）。V63の法規の解説の修正はそのまま残っています。"},{v:63,d:"2026-11-23",t:"21:02",s:"法規の解説を、整備士の法令まとめ資料（2級自動車整備士／法令のまとめ）と照合して修正：点検整備記録簿の保存期間の説明（事業用・自家用貨物は1年、自家用乗用は2年）、特定整備のかじ取り装置の記述、「完了した年月日」への統一、軽自動車の登録の説明。別の回に同じ問題が出ている場合は、どの回で解いても解いた問題として数えるよう変更（未回答・間違えた問題・進み具合・出題。同じ問題が1回の練習で重複して出ることもなくなりました）。これまでの学習記録はそのまま使えます。問題文・選択肢・正解は変更なし"},{v:62,d:"2026-11-23",t:"18:17",s:"文章で答える問題の解説を全文読み直し。誤りの修正、同じ内容の選択肢で説明文と訂正の箱の言い回しを統一（クラッチ容量、懸架装置、パワー・ステアリング、リミテッド・スリップ・デフ、ブレーキ、タイヤ、SRS、CAN、日常点検、特定整備、添加剤、オクタン価など）。根拠を確認できない記述は削除するか断定しない表現に変更。問題文・選択肢・正解は変更なし"},{v:61,d:"2026-11-23",t:"17:12",s:"模試の40問を解き終えた結果に「合格／不合格」を表示（40点中28点以上、かつ各分野が責任点以上）。分野ごとの得点と責任点も表示。検索画面の押しにくさを修正：キーワードを入れた直後に「全てをクリア」が押せない状態のままになる不具合を直し、検索窓の余白・「全てをクリア」・月の切り替えの押せる範囲を広げた。ギヤ・オイルの粘度（できるだけ低いもの）とカム角センサー（凹部）の解説を修正"},{v:60,d:"2026-11-23",t:"16:22",s:"計算・図・組み合わせなど、問題文と選択肢だけでは分かりにくい254問に「要点」を追加。あわせて問題文・選択肢・解説を読み合わせ、選択肢と合わない説明や他の年度と食い違う解説25か所、意味のない訂正の箱3か所、計算の手順の誤記・不要な定型文29か所を修正"},{v:59,d:"2026-11-23",t:"16:07",s:"選択肢ごとの解説がなかった295か所（正解の選択肢250・不正解45、主にジーゼルの図・計算・法規の問題）に解説を追加し、全2,160問・8,640選択肢すべてに解説がそろった。別の問題向けの文が紛れていた解説3か所も修正。あわせて、解説データを1つのファイルにまとめ、7段階の上書きをなくした（表示は変わらない）。"},{v:58,d:"2026-11-23",t:"15:57",s:"点検にもとづく整理と軽量化。問題データから画面で使わない項目と重複した解説文をまとめて約12％軽く（3.45MB→3.03MB）。検索の「よみ」データ（1.9MB）は、ひらがなで探すときだけ読むように。重なっていた見た目の指定と使っていないコードを削除。選択肢ごとの解説がない選択肢で解説欄が空になっていたのを、問題全体の要点を代わりに出すよう修正。回答後の「✕ 不正解／✓ 正解」の札の文字が背景と同じ色で読めなかった不具合も修正。"},{v:57,d:"2026-11-23",t:"14:10",s:"出題画面（模試・練習・復習）の上の「4 / 40」を押すと、1〜40の番号の一覧が開き、押した番号の問題へすぐ移動できるようにした。番号は正解（緑）・不正解（赤）・未回答・いまの問題が分かる色分け。"},{v:56,d:"2026-11-23",t:"14:05",s:"問題文と選択肢を、背景と区別できる白い面（細い枠）に置いた（「以前の緑」は薄いグレー）。問題文と選択肢の文字を、ほかの文字より少し濃く・少し大きくした。"},{v:55,d:"2026-11-23",t:"14:00",s:"見た目を落ち着いた形に戻した：影をなくし、枠は細く、文字と見出しを小さめに、選択肢は枠なしの薄いグレーの箱と「(1)」の番号に。正解・不正解の札も塗りつぶしをやめて細い枠に。記録 › 表示 に「デザイン」を追加し、青緑（標準）・モノトーン・和紙・以前の緑の4つから選べるようにした。検索の「全てをクリア」を常に表示。"},{v:54,d:"2026-11-23",t:"13:16",s:"検索画面を作り直し。「条件を組み合わせて検索」の枠に、検索窓（履歴・検索ボタン付き）、「問題文だけを検索」、資格区分（2級ガソリン・2級ジーゼル）、開閉できる「実施年月・番号・タグ」（タグと問題番号を横並びにして、それぞれにリセットボタン、実施年、実施月）をまとめた。タグは分野ごとのテーマ（例：動弁機構、ブレーキ）と、図のある問題・計算問題でも絞り込める。"},{v:53,d:"2026-11-23",t:"13:06",s:"配色を変更。生成りの白地に墨色の文字、メインのボタンは墨色、選択中や強調は深い藍、正解・不正解は落ち着いた緑とれんが色、ガソリン・ジーゼルの札も彩度を抑えた色にした。"},{v:52,d:"2026-11-23",t:"13:04",s:"デザイン刷新（第3段）。ホームと練習を「勉強」1画面に統合し、下のメニューを4つ（勉強・検索・模試・記録）に。勉強は「おまかせで10問」と未回答・間違えた・お気に入りをすぐ押せる形にし、細かい条件は「条件を指定して出題」に畳んだ。模試一覧は各回1行で、ガソリン・ジーゼルの状況（未実施・途中・点数）が一目で分かる形に。文字の大きさの切り替えは記録タブの「表示」へ移動。"},{v:51,d:"2026-11-23",t:"13:01",s:"デザイン刷新（第2段）。検索を作り直し：検索窓と絞り込み（ガソリン・ジーゼル・分野・実施回・No.）を上に固定し、結果を詰めて一覧表示。実施年・月の指定は「令和◯年度 第◯回」の1つにまとめた。検索から開いた問題は、上に「‹ 検索結果」と番号、下に前後の移動を固定。"},{v:50,d:"2026-11-23",t:"12:59",s:"デザイン刷新（第1段）。配色・書体（BIZ UDPゴシック）・ボタン類を一新。出題画面（練習・模試・復習）を作り直し：問題文はカードから出して読みやすく、選択肢は番号の丸付きカード。回答すると正解・不正解の札が付き、選んだ選択肢と正解の解説がそのすぐ下に開く（タップで開閉）。年の表記を「令和◯年度 第◯回」に統一。"},{v:49,d:"2026-11-23",t:"12:38",s:"問題の画面（練習・模試・復習・検索から開いた問題）の上のほうに、問題文と選択肢をコピーするボタンを追加。横幅いっぱいで押せる。"},{v:48,d:"2026-11-23",t:"12:27",s:"適切な選択肢の解説から、他の年度の選択肢向けの補足（※「◯◯」は誤り、など）を削除（209件）。その選択肢自体の解説だけにした。不適切な選択肢の「どこが誤りか」の補足は残している。"},{v:47,d:"2026-11-23",t:"12:21",s:"令和7年度第1回ガソリンNo.13の選択肢(3)の解説から、内容と合わない一文（※「1回」は誤り）を削除。"},{v:46,d:"2026-11-23",t:"12:22",s:"検索の回答表示を2つに分けた。「回答を開く」は従来どおり問題の下に答えと各選択肢の解説をまとめて表示。これとは別に、選択肢をタップするとその選択肢のすぐ下に解説が出る（もう一度タップで閉じる）。"},{v:45,d:"2026-11-23",t:"12:20",s:"検索の回答表示をさらに見分けやすく変更。選択肢は青みのある灰色の見出しに丸い番号・太字、正解には「正解」の札。解説は白地で少し小さい字にした。"},{v:44,d:"2026-11-23",t:"12:16",s:"検索の回答表示を見分けやすく変更。選択肢と解説を1つの枠にまとめ、解説側に「解説」の見出しと適切／不適切の色付き線を付けた。"},{v:43,d:"2026-11-23",t:"12:13",s:"検索から開いた問題で「回答を開く」を押すと、各選択肢のすぐ下にその解説が出る形に変更（選択肢→解説→次の選択肢…の順）。選択肢をタップするとその解説だけ閉じる。余白も少なめに。"},{v:42,d:"2026-11-23",t:"12:04",s:"画面の余白を詰めた（左右の余白、問題カード・選択肢の内側、解説の行間）。検索から開いた問題で、選択肢をタップしても色が変わらないようにした。"},{v:41,d:"2026-11-23",t:"08:41",s:"模試一覧を「年度・第◯回」で並べるよう変更（これまでは西暦の暦年で区切っていたため、3月実施の第2回が翌年に入っていた）。全27回（ガソリン・ジーゼル各27回）と表示。"},{v:40,d:"2026-11-23",t:"08:40",s:"文章問題の解説を全件見直し、約110問を修正。電動ファン回路の低速時の電圧計表示は「約6V（試験の定石）」に統一。説明の逆転・誤字、根拠のない数値や条文番号も直した。"},{v:39,d:"2026-11-23",t:"08:24",s:"解説の内容チェック：要点・図の補足（約730件）と図問題の選択肢解説を見直し、誤り（電動ファン電圧計、ライト消し忘れ警報のリレー、エア・油圧式ブレーキ、タイヤ摩耗の原因、ATの締結要素など）を修正。作業メモ調の文や崩れた言い回しも直した。"},{v:38,d:"2026-11-23",t:"08:12",s:"全27回分（2,160問）の正解番号を公式の解答PDFと照合し、すべて一致を確認（全員正解の2問はサイトの訂正版を採用）。ピストン・リング（バレル・フェース型）の解説の訂正文を修正。令和2年度第1回ジーゼルNo.1の図（指圧線図）の網かけを見やすく清書。"},{v:37,d:"2026-11-23",t:"07:53",s:"Ver.32以前の更新内容を履歴に追記。"},{v:36,d:"2026-11-23",t:"07:50",s:"「更新履歴」ページを追加（記録タブの下から開けます）。"},{v:35,d:"2026-11-23",t:"07:45",s:"ジーゼルの図問題に、選択肢ごとの解説を338件追加。電動ファンの電圧計など、要点に誤りがあった問題を修正。"},{v:34,d:"2026-11-23",t:"07:43",s:"図の清書（背景を白く、線をくっきり、2倍に拡大）を全436問に反映。"},{v:33,d:"2026-11-23",t:"",s:"追加11回分の図を含め、図が必要な436問すべてを取り込み。"},{v:"32以前",d:"2026年11月22〜23日",t:"",s:"検索モードを追加。問題文の一覧から問題詳細ページへ移動し、「回答を開く」で答えと選択肢ごとの解説を表示。ひらがな・カタカナ・漢字のどれでも検索でき、「適切」で探したときは不適切問題を除外。"},{v:"32以前",d:"2026年11月22〜23日",t:"",s:"画面を全面的に改修。参考画面に合わせた配色・選択肢のデザイン、解説の開閉、文字サイズの切り替え、下部メニューの自動非表示。"},{v:"32以前",d:"2026年11月22〜23日",t:"",s:"解説の整理。作業メモのような文言の除去、文体の統一、解説がなかった選択肢（ライト消し忘れ警報・論理回路など）の補完、「考えられない」型3問の○×の向きをそろえた。"},{v:"32以前",d:"2026年11月22〜23日",t:"",s:"ジーゼル全問に解説を追加（文章の選択肢は個別、図・数値・組み合わせの問題は要点＋選択肢別の自動解説）。"},{v:"32以前",d:"2026年11月22〜23日",t:"",s:"JASPAが「全員正解」とした問題は、整備士ドットコムの訂正後の問題文・選択肢・正解をサイトに採用。"},{v:"32以前",d:"2026年11月22〜23日",t:"",s:"ガソリンの解説を新形式に変更。選択肢ごとに判定バッジ、誤「…」→正「…」、短い解説を表示。"},{v:"32以前",d:"2026年11月22〜23日",t:"",s:"初版を公開。勉強モード（資格・出題範囲・出題数の条件、履歴・お気に入り）と模試モード（年・実施月ごとの本番形式40問、学校プリントのチェック）。タップした選択肢の下に答えと解説を表示。"}],APPV="121de9a185",boot=s=>{const t=s.q,a={};t.forEach(s=>a[s.id]=s);const n="seibi2:",e={g(s,t){try{const a=localStorage.getItem(n+s);return a?JSON.parse(a):t}catch(s){return t}},s(s,t){try{null==t?localStorage.removeItem(n+s):localStorage.setItem(n+s,JSON.stringify(t))}catch(s){}}};let l=e.g("hist",{}),o=e.g("fav",{}),i=e.g("logs",[]),c=e.g("exr",{}),d=e.g("sch",{});const r=s=>l[s.id],u=Math.min(...t.map(s=>s.y)),p=Math.max(...t.map(s=>s.y)),m=Object.assign({tab:"home",mode:"all",k:{g:1,d:1},y0:u,y1:p,tags:[],n:10,fz:"m",skin:"teal"},e.g("cfg",{})),v=[["teal","青緑",["#eef3f6","#137a7a","#17324d"]],["mono","モノトーン",["#f6f6f6","#6b6b6b","#141414"]],["washi","和紙",["#f6f5f2","#24456b","#202327"]],["green","以前の緑",["#fcfcf9","#16696a","#e1e4de"]]];"study"!==m.tab&&"practice"!==m.tab||(m.tab="home");const g=()=>{e.s("cfg",m),e.s("exr",c),e.s("sch",d)},b={g:{l:"二級ガソリン",s:"ガソリン"},d:{l:"二級ジーゼル",s:"ジーゼル"}},$={all:{l:"すべて",f:()=>!0},new:{l:"未回答",f:s=>!r(s)},wrong:{l:"間違えた問題",f:s=>{const t=r(s);return t&&0===t.r}},fav:{l:"お気に入り",f:s=>!!o[s.id]}},h=[10,20,40,0],f=[...new Set(t.map(s=>s.t[0]))],y={home:'<svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5h4v5
